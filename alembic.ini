# For the alembic CLI (`uv run alembic revision --autogenerate -m ...`). Runtime code uses clipforge.db.migrate.
[alembic]
script_location = src/clipforge/db/migrations
sqlalchemy.url = sqlite:///data/clipforge.db
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
